openapi: 3.0.3

info:
  title: API Modèles IA
  version: 1.0.0
  description: API de gestion d'une collection de modèles d'intelligence artificielle.

servers:
  - url: http://localhost:3000

paths:
  /api/ai-models:
    get:
      summary: Récupérer tous les modèles
      responses:
        '200':
          description: Liste des modèles récupérée avec succès.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiModel'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Ajouter un modèle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAiModelInput'
      responses:
        '201':
          description: Modèle créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/ai-models/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      summary: Récupérer un modèle
      responses:
        '200':
          description: Modèle trouvé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      summary: Modifier un modèle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAiModelInput'
      responses:
        '200':
          description: Modèle modifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Supprimer un modèle
      responses:
        '204':
          description: Modèle supprimé.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:
    AiModel:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: GPT-4
        editor:
          type: string
          example: OpenAI
        releaseYear:
          type: integer
          minimum: 1950
          maximum: 2100
          example: 2023
        genre:
          type: string
          example: LLM
        rating:
          type: number
          minimum: 0
          maximum: 10
          example: 9.0
    CreateAiModelInput:
      type: object
      required: [title, editor, releaseYear, genre, rating]
      properties:
        title:
          type: string
          example: Claude 3 Opus
        editor:
          type: string
          example: Anthropic
        releaseYear:
          type: integer
          minimum: 1950
          maximum: 2100
          example: 2024
        genre:
          type: string
          example: LLM
        rating:
          type: number
          minimum: 0
          maximum: 10
          example: 9.0
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: string
  responses:
    BadRequest:
      description: Identifiant ou données invalides.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Modèle introuvable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Erreur interne du serveur.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'